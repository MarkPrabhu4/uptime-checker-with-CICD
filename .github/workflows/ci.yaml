name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          cd backend
          pytest

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker images
        run: |
          docker build -t markprabhu/uptime-backend:latest ./backend
          docker build -t markprabhu/uptime-frontend:latest ./frontend

      - name: Push images to Docker Hub
        run: |
          docker push markprabhu/uptime-backend:latest
          docker push markprabhu/uptime-frontend:latest

      - name: Simulated Deploy
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh
