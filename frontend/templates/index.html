<!DOCTYPE html>
<html>
<head>
    <title>Uptime Checker</title>
</head>
<body>
    <h1>Uptime Checker</h1>
    <form method="POST">
        <input type="text" name="url" placeholder="https://example.com" required>
        <button type="submit">Check</button>
    </form>

    {% if result %}
        <h2>Result:</h2>
        <pre>{{ result }}</pre>
    {% endif %}
</body>
</html>
